name: Facebook auto-post

# Publishes to the Vegas Kiddos Facebook Page via the Graph API:
#   • a single-event highlight most days
#   • a "this weekend" roundup on Fridays
# Posting is skipped (compose-only) unless FB_PAGE_ID + FB_PAGE_TOKEN secrets
# are set, so enabling it is just a matter of adding those two secrets.

on:
  # Crons run daily, but the daily/roundup modes self-pause (RESUME_AFTER in
  # fb-post.mjs) until Jun 13 so they don't double up with the Facebook-native
  # scheduled batch that covers through Jun 12. After that date they resume
  # automatically — no manual re-enable needed.
  schedule:
    - cron: "0 18 * * 0-4,6" # 11:00 PT — daily highlight (Sun–Thu, Sat)
    - cron: "0 16 * * 5"     # 09:00 PT Fri — weekend roundup
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = post now · roundup = weekend list · schedule = queue a batch · verify = check token"
        type: choice
        default: schedule
        options: [schedule, daily, roundup, verify, repair-audit, repair, restore-timing]
      per_day:
        description: "Posts per day (schedule mode)"
        default: "3"
      days:
        description: "Number of days to fill (schedule mode)"
        default: "30"
      times:
        description: "PT hours for the daily slots, comma-separated (schedule mode)"
        default: "9,13,17"
      start:
        description: "First day YYYY-MM-DD, PT (schedule mode; blank = today)"
        default: ""
      dry_run:
        description: "Compose only, do not post"
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Publish to Facebook Page
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          # Trigger → mode. CRON fires the recurring posts: the Friday 16:00 UTC
          # cron does the weekend roundup, every other cron does a daily highlight.
          # `schedule` (batch-queue ~90 posts) is ONLY ever a manual choice — never
          # a cron default, or every cron would queue a whole batch.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 16 * * 5" ]; then MODE=roundup; else MODE=daily; fi
          else
            MODE="${{ github.event.inputs.mode }}"; MODE="${MODE:-schedule}"
          fi
          PER_DAY="${{ github.event.inputs.per_day || '3' }}"
          DAYS="${{ github.event.inputs.days || '30' }}"
          TIMES="${{ github.event.inputs.times || '9,13,17' }}"
          START="${{ github.event.inputs.start }}"
          DRY=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          echo "Running fb-post: mode=$MODE per_day=$PER_DAY days=$DAYS times=$TIMES start=${START:-today} $DRY"
          case "$MODE" in
            repair-audit) node tools/fb-repair-posts.mjs audit ;;
            repair)       node tools/fb-repair-posts.mjs repair ;;
            restore-timing) node tools/fb-repair-posts.mjs restore-timing ;;
            schedule)     node tools/fb-post.mjs schedule --per-day "$PER_DAY" --days "$DAYS" --times "$TIMES" ${START:+--start "$START"} $DRY ;;
            *)            node tools/fb-post.mjs "$MODE" $DRY ;;
          esac
