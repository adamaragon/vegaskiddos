name: Facebook auto-post

# Publishes to the Vegas Kiddos Facebook Page via the Graph API:
#   • a single-event highlight most days
#   • a "this weekend" roundup on Fridays
# Posting is skipped (compose-only) unless FB_PAGE_ID + FB_PAGE_TOKEN secrets
# are set, so enabling it is just a matter of adding those two secrets.

on:
  # Crons run daily, but the daily/roundup modes self-pause (RESUME_AFTER in
  # fb-post.mjs) until Jun 13 so they don't double up with the Facebook-native
  # scheduled batch that covers through Jun 12. After that date they resume
  # automatically — no manual re-enable needed.
  schedule:
    - cron: "0 18 * * 0-4,6" # 11:00 PT — daily highlight (Sun–Thu, Sat)
    - cron: "0 16 * * 5"     # 09:00 PT Fri — weekend roundup
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = post now · roundup = weekend list · schedule = queue a batch · verify = check token"
        type: choice
        default: schedule
        options: [schedule, daily, roundup, verify]
      count:
        description: "How many posts to queue (schedule mode only)"
        default: "14"
      dry_run:
        description: "Compose only, do not post"
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Publish to Facebook Page
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          MODE="${{ github.event.inputs.mode || 'schedule' }}"
          COUNT="${{ github.event.inputs.count || '14' }}"
          DRY=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          echo "Running fb-post: mode=$MODE count=$COUNT $DRY"
          node tools/fb-post.mjs "$MODE" "$COUNT" $DRY
