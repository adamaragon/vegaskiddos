name: Deploy (Cloudflare Workers)

# Builds the OpenNext bundle and deploys the Worker via wrangler — the same
# path as a local `npm run cf:deploy`, which is the only deploy method that has
# ever worked here (every successful deploy shows source: wrangler). Replaces
# the flaky Cloudflare native git-build. Runtime secrets already live on the
# Worker and persist across deploys; CI only needs build-time env below.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "tools/**"
      - "assets/**"
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Build + deploy (OpenNext → Workers)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Build-time env (data for SSG/sitemap + public VAPID key).
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
        # Deploy with plain `wrangler deploy` (not `opennextjs-cloudflare
        # deploy`): the latter pre-warms the R2 incremental cache via the CF R2
        # management API, which fails in CI ("Premature close") because the
        # CLOUDFLARE_API_TOKEN secret can't reach the R2 bucket-management API.
        # The R2 binding (wrangler.jsonc) still works at runtime, so the cache
        # fills lazily — we just skip the deploy-time pre-warm. To restore
        # pre-warm, give the token "Workers R2 Storage" scope and switch back to
        # `npm run cf:deploy`.
        run: |
          npm run cf:build
          npx wrangler deploy
