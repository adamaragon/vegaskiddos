name: Deploy (Cloudflare Workers)

# Builds the OpenNext bundle and deploys the Worker via wrangler — the same
# path as a local `npm run cf:deploy`, which is the only deploy method that has
# ever worked here (every successful deploy shows source: wrangler). Replaces
# the flaky Cloudflare native git-build. Runtime secrets already live on the
# Worker and persist across deploys; CI only needs build-time env below.

# Push auto-deploy is DISABLED on purpose (2026-06-27). `npm run cf:deploy`
# pre-warms the R2 incremental cache (open-next.config.ts → r2IncrementalCache),
# which calls Cloudflare's R2 *management* API. On the runner that call dies with
# "Premature close" because the CLOUDFLARE_API_TOKEN repo secret can't reach the
# R2 management API (an R2-scoped token works fine off-runner — every manual
# `npm run cf:deploy` succeeds). Until the secret is given "Workers R2 Storage"
# scope, every push failed the deploy and emailed. Fix = update the secret, then
# restore the `push:` block below. Meanwhile: deploy manually with
# `npm run cf:deploy` (token in vault) or trigger this workflow by hand.
on:
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Build + deploy (OpenNext → Workers)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Build-time env (data for SSG/sitemap + public VAPID key).
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
        run: npm run cf:deploy
