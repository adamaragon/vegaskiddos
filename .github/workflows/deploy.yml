name: Deploy (Cloudflare Workers)

# Builds the OpenNext bundle and deploys the Worker via wrangler — the same
# path as a local `npm run cf:deploy`, which is the only deploy method that has
# ever worked here (every successful deploy shows source: wrangler). Replaces
# the flaky Cloudflare native git-build. Runtime secrets already live on the
# Worker and persist across deploys; CI only needs build-time env below.

# Push to main auto-deploys. The R2 cache pre-warm (open-next.config.ts →
# r2IncrementalCache) calls Cloudflare's R2 management API, which needs the
# CLOUDFLARE_API_TOKEN secret to have R2 access — restored 2026-06-28 (the
# secret had an older, narrower token that failed with "Premature close").
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "tools/**"
      - "assets/**"
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: R2 API connectivity diagnostic (temporary)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/vegaskiddos-cache"
          echo "node: $(node -v)"
          echo "-- curl default --"; curl -sS -o /dev/null -w "http=%{http_code} err=%{errormsg}\n" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$URL" || echo "curl default FAILED $?"
          echo "-- curl -4 --"; curl -4 -sS -o /dev/null -w "http=%{http_code} err=%{errormsg}\n" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$URL" || echo "curl -4 FAILED $?"
          echo "-- curl -6 --"; curl -6 -sS -o /dev/null -w "http=%{http_code} err=%{errormsg}\n" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$URL" || echo "curl -6 FAILED $?"
          node -e 'const u="https://api.cloudflare.com/client/v4/accounts/"+process.env.CLOUDFLARE_ACCOUNT_ID+"/r2/buckets/vegaskiddos-cache";fetch(u,{headers:{Authorization:"Bearer "+process.env.CLOUDFLARE_API_TOKEN}}).then(r=>console.log("node fetch http="+r.status)).catch(e=>console.log("node fetch ERR="+e.message+" cause="+(e.cause&&e.cause.message)))'
      - name: Build + deploy (OpenNext → Workers)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Build-time env (data for SSG/sitemap + public VAPID key).
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
        run: npm run cf:deploy
