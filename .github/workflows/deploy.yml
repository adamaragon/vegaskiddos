name: Deploy (Cloudflare Workers)

# Builds the OpenNext bundle and deploys the Worker via wrangler — the same
# path as a local `npm run cf:deploy`, which is the only deploy method that has
# ever worked here (every successful deploy shows source: wrangler). Replaces
# the flaky Cloudflare native git-build. Runtime secrets already live on the
# Worker and persist across deploys; CI only needs build-time env below.

# Push to main auto-deploys. The R2 cache pre-warm (open-next.config.ts →
# r2IncrementalCache) calls Cloudflare's R2 management API, which needs the
# CLOUDFLARE_API_TOKEN secret to have R2 access — restored 2026-06-28 (the
# secret had an older, narrower token that failed with "Premature close").
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "tools/**"
      - "assets/**"
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # GitHub-hosted runners have no working IPv6 route to api.cloudflare.com
      # (verified: `curl -6` can't connect; `curl -4` + node fetch = 200).
      # OpenNext's R2 cache-populate fetch reaches for IPv6 anyway and dies with
      # "Premature close" (it ignores --dns-result-order). Removing IPv6 from the
      # runner leaves only the working IPv4 path.
      - name: Disable IPv6 (no IPv6 route to api.cloudflare.com on runners)
        run: sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1 net.ipv6.conf.default.disable_ipv6=1
      - name: Build + deploy (OpenNext → Workers)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Build-time env (data for SSG/sitemap + public VAPID key).
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: npm run cf:deploy
