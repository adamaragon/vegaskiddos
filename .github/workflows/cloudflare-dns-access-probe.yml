name: Cloudflare DNS access probe

# One-off, read-only validation of the existing GitHub-held Cloudflare token.
# It intentionally makes no DNS, zone, deployment, or account changes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verify Cloudflare access without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const headers = { Authorization: `Bearer ${token}` };

          async function request(path) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, { headers });
            const body = await response.json().catch(() => ({}));
            return {
              status: response.status,
              success: body.success === true,
              errors: (body.errors || []).map((error) => error.code),
              result: body.result,
            };
          }

          const verification = await request('/user/tokens/verify');
          console.log(`token verification: ${verification.success ? 'valid' : `failed (${verification.status})`}`);

          const account = await request(`/accounts/${accountId}`);
          console.log(`account read: ${account.success ? 'allowed' : `denied (${account.status})`}`);

          for (const name of ['dndcards.com', 'dndwar.com', 'dndnote.com', 'dnd.chat']) {
            const zones = await request(`/zones?name=${encodeURIComponent(name)}`);
            if (!zones.success) {
              console.log(`${name}: zone read denied (${zones.status})`);
              continue;
            }
            const state = Array.isArray(zones.result) && zones.result.length > 0
              ? zones.result.map((zone) => zone.status || 'present').join(', ')
              : 'not present';
            console.log(`${name}: ${state}`);
          }

          const workerServices = await request(`/accounts/${accountId}/workers/services`);
          console.log(`Workers API read: ${workerServices.success ? 'allowed' : `denied (${workerServices.status})`}`);

          if (!verification.success && !account.success && !workerServices.success) process.exit(1);
          NODE
