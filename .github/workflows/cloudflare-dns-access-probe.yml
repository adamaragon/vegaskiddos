name: Cloudflare DNS access probe

# Manual Cloudflare DNS control plane. The default mode is read-only; the
# explicit stage-zones mode only creates pending zones and forces web records
# to DNS-only before any registrar nameserver change.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only probe or safe zone staging
        required: true
        type: choice
        default: probe
        options:
          - probe
          - stage-zones

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MODE: ${{ inputs.mode }}
    steps:
      - name: Verify Cloudflare access without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const mode = process.env.MODE || 'probe';
          const headers = { Authorization: `Bearer ${token}` };

          async function request(path, init = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...init,
              headers: {
                ...headers,
                ...(init.body ? { 'Content-Type': 'application/json' } : {}),
                ...(init.headers || {}),
              },
            });
            const body = await response.json().catch(() => ({}));
            return {
              status: response.status,
              success: body.success === true,
              errors: (body.errors || []).map((error) => error.code),
              result: body.result,
            };
          }

          const verification = await request('/user/tokens/verify');
          console.log(`token verification: ${verification.success ? 'valid' : `failed (${verification.status})`}`);

          const account = await request(`/accounts/${accountId}`);
          console.log(`account read: ${account.success ? 'allowed' : `denied (${account.status})`}`);

          for (const name of ['dndcards.com', 'dndwar.com', 'dndnote.com', 'dnd.chat']) {
            const zones = await request(`/zones?name=${encodeURIComponent(name)}`);
            if (!zones.success) {
              console.log(`${name}: zone read denied (${zones.status})`);
              continue;
            }
            const state = Array.isArray(zones.result) && zones.result.length > 0
              ? zones.result.map((zone) => zone.status || 'present').join(', ')
              : 'not present';
            console.log(`${name}: ${state}`);
          }

          const workerServices = await request(`/accounts/${accountId}/workers/services`);
          console.log(`Workers API read: ${workerServices.success ? 'allowed' : `denied (${workerServices.status})`}`);

          if (mode === 'stage-zones') {
            for (const name of ['dndcards.com', 'dndwar.com', 'dndnote.com', 'dnd.chat']) {
              const existing = await request(`/zones?name=${encodeURIComponent(name)}`);
              let zone = existing.success && existing.result?.[0];
              if (!zone) {
                const created = await request('/zones', {
                  method: 'POST',
                  body: JSON.stringify({ name, account: { id: accountId }, jump_start: true }),
                });
                if (!created.success) {
                  console.log(`${name}: zone staging failed (${created.status})`);
                  continue;
                }
                zone = created.result;
              }

              const records = await request(`/zones/${zone.id}/dns_records?per_page=5000`);
              let forcedDnsOnly = 0;
              if (records.success) {
                for (const record of records.result || []) {
                  if (!['A', 'AAAA', 'CNAME'].includes(record.type) || record.proxied !== true) continue;
                  const updated = await request(`/zones/${zone.id}/dns_records/${record.id}`, {
                    method: 'PATCH',
                    body: JSON.stringify({ proxied: false }),
                  });
                  if (updated.success) forcedDnsOnly += 1;
                }
              }

              const nameservers = Array.isArray(zone.name_servers) ? zone.name_servers.join(', ') : 'unavailable';
              const recordCount = records.success ? (records.result || []).length : 'unavailable';
              console.log(`${name}: staged (${zone.status || 'unknown'}), records=${recordCount}, forced-dns-only=${forcedDnsOnly}, nameservers=${nameservers}`);
            }
          }

          if (!verification.success && !account.success && !workerServices.success) process.exit(1);
          NODE
