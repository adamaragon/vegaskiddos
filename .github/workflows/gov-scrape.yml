name: Daily event scrape

# Daily catalog refresh. Two scrapers upsert events; enrichers self-heal gaps:
#   1. gov-scrape.mjs — headless browser for JS gov calendars (pending review).
#   2. `npm run scrape` — fetch adapters; fills blank descriptions then
#      publishPending() auto-approves new non-duplicate events (same as Netlify).
#   3. Enrich step — descriptions (backup), geocode, infer-ages for all sources.
# Runs daily and on demand. Each scraper is independent (always()) so one
# failing doesn't skip the other or the enrichers.

on:
  schedule:
    - cron: "30 15 * * *" # 08:30 PT daily
  workflow_dispatch: {}

permissions:
  contents: write # to commit the updated image-sync manifest

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install deps (incl. Puppeteer Chromium)
        run: npm ci
      - name: Run gov scraper
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          # Optional: enables auto-translation of new events to Spanish.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node tools/gov-scrape.mjs

      # Fetch-based adapters (WP calendars, library iCal feeds, Nevada Moms).
      # always() so a gov-scrape failure above doesn't skip these.
      - name: Run fetch scraper (library + WP calendars)
        if: ${{ always() }}
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run scrape

      # Cancellation sweep: re-fetch every feed and flag approved, upcoming,
      # one-time events that have VANISHED from their source feed AND whose own
      # URL confirms it (404/410 or "cancelled"/"postponed" text). Flagged events
      # are MARKED Canceled (a banner shows on the card + event page and they're
      # never social-posted) — they stay visible, not deleted, so a false
      # positive is just a reversible banner. Events that reappear in their feed
      # are auto-un-cancelled. High-confidence only; vanished-but-unconfirmed
      # cases are logged for review. A source that errored or returned zero is
      # skipped entirely (a feed hiccup never mass-cancels).
      - name: Sweep for cancellations
        if: ${{ always() }}
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: npm run sweep -- --apply || true

      # Self-heal incomplete events from every source (gov, library, Netlify
      # scraper): fill blank descriptions, geocode missing coordinates, and tag
      # missing age groups. All idempotent — they only touch non-rejected events
      # still missing the field, so it's cheap once the catalog is backfilled.
      - name: Enrich events (descriptions, coordinates, age tiers)
        if: ${{ always() }}
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          npm run fill-descriptions
          node tools/geocode-events.mjs
          node tools/infer-ages.mjs

      # Auto-generate AI event art for any approved events missing an image of
      # any kind. Runs at low quality (~$0.011/image) and only touches events
      # with neither ArtImage nor Image set, so this is cheap once the catalog
      # is backfilled — typical daily cost is a few cents. The sync step below
      # then picks up the new ArtImage attachments and pushes them to R2.
      - name: Generate art for new approved events
        if: ${{ always() }}
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEN_QUALITY: low
        run: node tools/gen-event-art.mjs batch || true

      # Durable images: sync each approved event's image to R2 as responsive
      # WebP (img.vegaskiddos.com/event/<id>/<w>.webp). The manifest skips
      # unchanged images, so daily runs only process new/changed events.
      # Requires repo secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID.
      - name: Sync event images to R2
        if: ${{ always() }}
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/sync-images.mjs

      - name: Commit updated image manifest
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/.image-sync-manifest.json || true
          git diff --staged --quiet || git commit -m "chore: update image-sync manifest [skip ci]"
          git push || true
