name: Daily event scrape

# Daily catalog refresh. Two scrapers feed the Airtable review queue
# (Approved=false — nothing auto-publishes):
#   1. gov-scrape.mjs — headless browser for JS-rendered government calendars
#      (City of Las Vegas, Clark County). Needs a real browser, hence not in
#      the Netlify build.
#   2. `npm run scrape` — fetch-based adapters (WP "The Events Calendar" sites,
#      LVCCLD + Henderson library iCal feeds, Nevada Moms). Same code the admin
#      "Run scrape" button calls, so the daily run needs no manual click.
# Runs daily and on demand. Each scraper is independent (always()) so one
# failing doesn't skip the other or the enrichers.

on:
  schedule:
    - cron: "30 15 * * *" # 08:30 PT daily
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install deps (incl. Puppeteer Chromium)
        run: npm ci
      - name: Run gov scraper
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          # Optional: enables auto-translation of new events to Spanish.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node tools/gov-scrape.mjs

      # Fetch-based adapters (WP calendars, library iCal feeds, Nevada Moms).
      # always() so a gov-scrape failure above doesn't skip these. Inserts to
      # the review queue with Approved=false — never auto-publishes.
      - name: Run fetch scraper (library + WP calendars)
        if: ${{ always() }}
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run scrape

      # Self-heal incomplete events from every source (gov, library, Netlify
      # scraper): fill blank descriptions, geocode missing coordinates, and tag
      # missing age groups. All idempotent — they only touch non-rejected events
      # still missing the field, so it's cheap once the catalog is backfilled.
      - name: Enrich events (descriptions, coordinates, age tiers)
        if: ${{ always() }}
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node tools/fill-blank-descriptions.mjs
          node tools/geocode-events.mjs
          node tools/infer-ages.mjs
